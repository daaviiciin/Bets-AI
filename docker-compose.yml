services:
  postgres:
    image: postgres:16-alpine
    container_name: betsai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betsai}
      # Sin valor por defecto: si falta en .env, docker compose se niega a arrancar.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-betsai}
    ports:
      # Solo en este equipo (127.0.0.1): no accesible desde la wifi/red local.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betsai} -d ${POSTGRES_DB:-betsai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
