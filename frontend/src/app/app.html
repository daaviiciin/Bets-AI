<div class="min-h-screen flex flex-col">
  <header
    class="border-b border-brand-cyan/15 bg-brand-bg-deep/85 backdrop-blur-md sticky top-0 z-10 shadow-[0_0_40px_-12px_rgb(0_229_255_/_18%)]">
    <div class="max-w-7xl mx-auto px-6 py-3.5">
      <div class="flex flex-col sm:flex-row sm:items-center gap-6 w-full justify-between">
        <a routerLink="/dashboard" class="flex items-center gap-3 group outline-none focus-visible:ring-2 focus-visible:ring-brand-cyan/50 rounded-lg">
          <img
            src="/brand/logo-bets-ai.png"
            alt="BETS Ai"
            width="148"
            height="52"
            class="h-11 sm:h-12 w-auto object-contain object-left drop-shadow-[0_0_16px_rgb(0_229_255_/_35%)] group-hover:drop-shadow-[0_0_22px_rgb(0_229_255_/_45%)] transition-[filter]" />
          <span class="sr-only">BETS Ai · Intelligent market analysis</span>
        </a>
        <div class="flex flex-wrap items-center gap-4 sm:gap-6 shrink-0">
          <nav class="flex gap-6 text-sm font-medium" aria-label="Principal">
            <a
              routerLink="/dashboard"
              routerLinkActive="text-brand-cyan font-semibold"
              [routerLinkActiveOptions]="{ exact: false }"
              class="text-brand-muted hover:text-white transition-colors">
              Dashboard
            </a>
            <a
              routerLink="/mis-apuestas"
              routerLinkActive="text-brand-cyan font-semibold"
              class="text-brand-muted hover:text-white transition-colors">
              Mis apuestas
            </a>
            @if (!auth.isLoggedIn()) {
              <a routerLink="/" class="text-brand-muted hover:text-white transition-colors">Entrar</a>
            }
          </nav>
          @if (auth.user()) {
            <div class="flex items-center gap-3 text-xs text-brand-muted">
              <span class="text-white font-medium">{{ auth.user()!.username }}</span>
              <button
                type="button"
                (click)="logout()"
                class="rounded-lg border border-brand-blue/35 px-3 py-1.5 text-brand-muted hover:border-brand-cyan/45 hover:text-white transition-colors">
                Salir
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-brand-cyan/10 py-6 text-center text-xs text-brand-muted">
    BETS Ai · MVP {{ year }} · Intelligent market analysis · No es asesoramiento financiero
  </footer>
</div>
