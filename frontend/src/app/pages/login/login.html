<!--
  Entrar. El rótulo entra como en la portada: "Bets" barre con su filete guía, la placa "AI" barre,
  se abren las dos placas y el filete, y después el formulario barre y sus piezas suben.
-->
<div class="login relative isolate flex min-h-[calc(100svh-4rem)] items-center overflow-hidden px-4 py-12 sm:px-8">
  <div class="cabezal" aria-hidden="true"></div>

  <div class="mx-auto grid w-full max-w-[1100px] items-center gap-12 lg:grid-cols-[1fr_26rem] lg:gap-20">
    <div>
      <p class="titulo rotulo flex items-center gap-[0.12em]" aria-label="Bets AI">
        <span class="tv-guia inline-block" style="--tv-t: 80ms">Bets</span>
        <span
          class="tv-placa skew inline-block bg-tv-ink px-[0.14em] text-tv-night"
          style="--tv-t: 240ms">
          <span class="unskew inline-block">AI</span>
        </span>
      </p>
      <span class="mt-5 flex items-center gap-3" aria-hidden="true">
        <span class="tv-barras" style="--tv-t: 80ms"></span>
        <span class="tv-trazo h-px w-24 bg-tv-line sm:w-40" style="--tv-t: 320ms"></span>
      </span>
      <p
        class="tv-sube mt-5 max-w-[30ch] text-lg text-tv-muted text-pretty sm:text-xl"
        style="--tv-t: 300ms">
        Cuotas de Winamax, estadísticas de Flashscore y el modelo Poisson, en una sola vista.
      </p>
    </div>

    <section
      class="tv-barrido border border-tv-line bg-tv-panel p-6 sm:p-8"
      style="--tv-t: 360ms"
      aria-labelledby="login-titulo">
      <h1 id="login-titulo" class="rotulo tv-sube text-3xl" style="--tv-t: 420ms">Entrar</h1>
      <p class="tv-sube mt-2 text-sm text-tv-muted" style="--tv-t: 450ms">
        Inicia sesión para ver los partidos, guardar tus apuestas y seguir los picks del modelo.
      </p>

      <form class="mt-7 space-y-4" (submit)="$event.preventDefault(); submit()" novalidate>
        <div class="tv-sube" style="--tv-t: 480ms">
          <label
            for="login-usuario"
            class="font-display mb-1.5 block text-xs font-bold uppercase tracking-wider text-tv-muted">
            Usuario
          </label>
          <input
            id="login-usuario"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            [value]="username()"
            (input)="username.set(($any($event.target).value || '').toString())"
            class="w-full border border-tv-line bg-tv-night px-4 py-3 text-tv-ink transition-colors placeholder:text-tv-muted focus:border-tv-ink focus:outline-none" />
        </div>
        <div class="tv-sube" style="--tv-t: 510ms">
          <label
            for="login-clave"
            class="font-display mb-1.5 block text-xs font-bold uppercase tracking-wider text-tv-muted">
            Contraseña
          </label>
          <input
            id="login-clave"
            type="password"
            autocomplete="current-password"
            [value]="password()"
            (input)="password.set(($any($event.target).value || '').toString())"
            class="w-full border border-tv-line bg-tv-night px-4 py-3 text-tv-ink transition-colors placeholder:text-tv-muted focus:border-tv-ink focus:outline-none" />
        </div>

        @if (error()) {
          <p class="border-l-2 border-tv-alert bg-tv-night px-4 py-3 text-sm text-tv-ink" role="alert">
            {{ error() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="busy()"
          style="--tv-t: 540ms"
          class="tv-placa skew mt-2 flex w-full items-center justify-center bg-tv-ink py-3 text-tv-night transition-[filter,scale] duration-150 hover:brightness-90 active:scale-[0.98] disabled:opacity-60">
          <span class="unskew rotulo flex items-center gap-2 text-lg">
            @if (busy()) {
              <span
                class="size-4 animate-spin rounded-full border-2 border-tv-night border-t-transparent"
                aria-hidden="true"></span>
              Entrando…
            } @else {
              Iniciar sesión
            }
          </span>
        </button>
      </form>
    </section>
  </div>
</div>
